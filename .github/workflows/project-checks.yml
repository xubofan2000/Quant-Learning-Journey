name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit learning records
        run: python project/scripts/project_audit.py
      - name: Run governance tests
        run: python -m unittest discover -s project/tests -v
